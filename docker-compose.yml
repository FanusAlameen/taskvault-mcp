services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      TASKVAULT_DATA_DIR: /app/data

    volumes:
      - taskvault_data:/app/data

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  taskvault_data:
